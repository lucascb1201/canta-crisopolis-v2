name = "canta-crisopolis-media"
main = "media-proxy.js"
compatibility_date = "2026-08-24"

# Hostname do Vercel Blob store — pegue de qualquer URL devolvida pelo upload.
[vars]
BLOB_HOST = "SEU-STORE-ID.public.blob.vercel-storage.com"

# Cria o DNS e o certificado automaticamente.
[[routes]]
pattern = "media.cantacrisopolis.com.br"
custom_domain = true
