# MongoDB apenas para desenvolvimento local.
# Produção roda na Vercel com MongoDB Atlas — veja DEPLOYMENT.md.
services:
  mongodb:
    image: mongo:7.0
    container_name: voting-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpassword}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
